name: FR24 Fetch
concurrency:
  group: fr24-fetch
  cancel-in-progress: true

on:
 # schedule:
 #   - cron: '*/15 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Run Script
        run: node fetch.js

      - name: Merge track folders
        run: |
          mkdir -p tracks

          mv tracks/arrivals/*.json tracks/ 2>/dev/null || true
          mv tracks/departures/*.json tracks/ 2>/dev/null || true

      - name: Commit and Push
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "update data"

          # The other workflow commits to this branch too, so main may have
          # moved while we were fetching. Rebase our single data commit onto
          # whatever landed and retry; only give up if it keeps moving.

          for attempt in 1 2 3 4 5; do

            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi

            echo "Push attempt ${attempt} failed, retrying"
            sleep 5

          done

          echo "Could not push after 5 attempts"
          exit 1
