name: FR24 Fetch

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Run Script
        run: node fetch.js

      - name: Merge track folders
        run: |
          mkdir -p tracks

          mv tracks/arrivals/*.json tracks/ 2>/dev/null || true
          mv tracks/departures/*.json tracks/ 2>/dev/null || true

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .

          git diff --cached --quiet || git commit -m "update data"

          git push
