# Schedule-only airports (COK, TRV) in a single job.
#
# Replaces the old cok.yml. Triggered by an external cron service via the
# workflow_dispatch API, so the file name is part of that URL -- renaming
# this file means updating the cron job too.

name: Schedules Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedules-fetch
  cancel-in-progress: true

jobs:

  fetch:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch scripts from the private repo
        env:
          SSH_KEY: ${{ secrets.FETCH_SRC_SSH_KEY }}
        run: |
          # Cloned into RUNNER_TEMP, deliberately outside the workspace. If it
          # sat inside, the "git add ." in the commit step could sweep the
          # private source into this public repo.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/fetch_src
          chmod 600 ~/.ssh/fetch_src
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/fetch_src -o IdentitiesOnly=yes"
          git clone --depth 1 --quiet git@github.com:onlineatcexam/fr24-fetch-private-side.git "${RUNNER_TEMP}/src"
          ls -1 "${RUNNER_TEMP}/src"

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/src
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Run schedules fetch
        run: node "${RUNNER_TEMP}/src/fetch-schedules.js"

      - name: Commit and Push
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Update schedule data"

          # The other workflow commits to this branch too, so main may have
          # moved while we were fetching. Rebase our single data commit onto
          # whatever landed and retry; only give up if it keeps moving.

          for attempt in 1 2 3 4 5; do

            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi

            echo "Push attempt ${attempt} failed, retrying"
            sleep 5

          done

          echo "Could not push after 5 attempts"
          exit 1
