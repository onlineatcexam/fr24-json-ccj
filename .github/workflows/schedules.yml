# Schedule-only airports (COK, TRV) in a single job.
#
# Replaces the old cok.yml. Triggered by an external cron service via the
# workflow_dispatch API, so the file name is part of that URL -- renaming
# this file means updating the cron job too.

name: Schedules Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedules-fetch
  cancel-in-progress: true

jobs:

  fetch:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Run schedules fetch
        env:
          FR24_TOKEN: ${{ secrets.FR24_TOKEN }}
        run: node fetch-schedules.js

      - name: Commit and Push
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git diff --cached --quiet || git commit -m "Update schedule data"

          git push
